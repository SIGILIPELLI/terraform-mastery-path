site_name: Terraform Mastery Path
site_description: A structured, module-wise HashiCorp Terraform (Infrastructure as Code) training program from entry level to master level.
site_url: https://sigilipelli.github.io/terraform-mastery-path/
repo_url: https://github.com/SIGILIPELLI/terraform-mastery-path
repo_name: terraform-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is IaC & Why Terraform?": level-1/01-what-is-iac-why-terraform.md
      - "02 · Installing Terraform & Providers": level-1/02-installing-terraform-providers.md
      - "03 · HCL Syntax Basics": level-1/03-hcl-syntax-basics.md
      - "04 · Providers & the Provider Registry": level-1/04-providers-registry.md
      - "05 · Resources & Data Sources": level-1/05-resources-data-sources.md
      - "06 · Variables & Outputs": level-1/06-variables-outputs.md
      - "07 · State Basics": level-1/07-state-basics.md
      - "08 · A First Real Resource": level-1/08-first-real-resource.md
      - "09 · Plan / Apply / Destroy Workflow": level-1/09-plan-apply-destroy.md
      - "10 · Formatting & Validation": level-1/10-fmt-validate.md
      - "11 · Capstone — Multi-Resource Configuration": level-1/11-capstone-multi-resource.md
  - "Level 2 · Intermediate":
